<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Github Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe5f1 100%);
            color: #4a1a2c;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header Section */
        header {
            background: linear-gradient(135deg, #8b1538 0%, #c41e3a 50%, #d4417a 100%);
            color: white;
            text-align: center;
            padding: 4rem 2rem;
            box-shadow: 0 4px 15px rgba(139, 21, 56, 0.3);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/></svg>');
            opacity: 0.3;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.2rem;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            opacity: 0.95;
        }

        /* Main Container */
        main {
            max-width: 1000px;
            margin: -50px auto 50px;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }

        /* Card Section */
        section {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(139, 21, 56, 0.15);
            margin-bottom: 2rem;
        }

        h2 {
            color: #8b1538;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
            border-bottom: 3px solid #ffb3d1;
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .course-section {
            margin-top: 2rem;
        }

        h3 {
            color: #c41e3a;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        /* Project List */
        .project-list {
            list-style: none;
            padding: 0;
        }

        .project-list li {
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }

        .project-list li:hover {
            transform: translateX(10px);
        }

        .project-list a {
            display: flex;
            align-items: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #fff0f6 0%, #ffe5f1 100%);
            border-left: 5px solid #8b1538;
            border-radius: 10px;
            text-decoration: none;
            color: #4a1a2c;
            font-size: 1.2rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(139, 21, 56, 0.1);
        }

        .project-list a:hover {
            background: linear-gradient(135deg, #8b1538 0%, #c41e3a 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(139, 21, 56, 0.3);
            border-left-color: #d4417a;
        }

        .project-list a::before {
            content: "→";
            font-size: 1.5rem;
            margin-right: 1rem;
            font-weight: bold;
            color: #c41e3a;
            transition: all 0.3s ease;
        }

        .project-list a:hover::before {
            color: #ffb3d1;
            transform: translateX(5px);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: #8b1538;
            font-size: 0.9rem;
        }

        footer a {
            color: #c41e3a;
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            color: #8b1538;
            text-decoration: underline;
        }

        /* Decorative Elements */
        .decorative-circle {
            position: fixed;
            border-radius: 50%;
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            background: #c41e3a;
            top: -150px;
            right: -150px;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            background: #d4417a;
            bottom: 50px;
            left: -100px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            header p {
                font-size: 1rem;
            }

            section {
                padding: 2rem 1.5rem;
            }

            h2 {
                font-size: 2rem;
            }

            h3 {
                font-size: 1.5rem;
            }

            .project-list a {
                font-size: 1rem;
                padding: 1rem;
            }
        }
    </style>
  </head>
  <body>
    <h1>Umurerwa Kalisa Tania</h1>
    <p>This website is for my data visualization work and other projects</p>

    <h2>Coursework</h2>
    <h3>CSC 363 Data Visualization</h3>

      <li> <a href="lab-7-multiple-views-taumurerwakalisa-1/trails-skeleton/index.html">Lab 7 - Linked Bar Chart and Scatterplot</a></li>
      <li> <a href="lab-8-advanced-topics-taumurerwakalisa/responsive/index.html">Lab 8 - Responsive Chart</a></li>

    </ul>
  </body>
</html>
